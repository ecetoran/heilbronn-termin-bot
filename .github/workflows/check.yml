name: Heilbronn randevu kontrolü

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub'ın izin verdiği en sık aralık (bazen birkaç dakika gecikebilir)
  workflow_dispatch:
    inputs:
      test_mode:
        description: "Telegram'a test mesajı gönder"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: termin-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6

      - name: Önceki kontrolün sonucunu yükle
        uses: actions/cache@v5
        with:
          path: state
          key: termin-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: termin-state-

      - name: Randevuları kontrol et (her çalıştırmada 4 kez, dakikada bir)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MAX_DATE: ${{ vars.MAX_DATE }}
          TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.test_mode }}
          CHECKS_PER_RUN: "4"
          CHECK_INTERVAL_SEC: "60"
        run: python3 check_termin.py
